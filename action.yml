name: JVM Runtime Risk Scan
description: JDK 27 readiness scan - JVM default changes, EOL and CVEs judged by actual usage, as a PR comment (Korean)
branding:
  icon: shield
  color: green
inputs:
  path:
    description: 스캔할 디렉터리
    default: .
  comment:
    description: PR 코멘트 작성 여부 (true/false)
    default: "true"
  deps-file:
    description: 미리 만들어 둔 의존성 해석 출력 파일 (gradle dependencies / mvn dependency:tree). 있으면 실제 버전과 전이 의존성까지 본다
    default: ""
  sarif:
    description: jvm-risk.sarif 도 생성 (true/false). 업로드는 호출 워크플로에서 github/codeql-action/upload-sarif 로
    default: "false"
  fail-on:
    description: 이 심각도 이상이 있으면 단계 실패 (critical|high|medium|low). 비우면 리포트만
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
    - id: jar
      shell: bash
      env:
        # 릴리스마다 이 값을 올린다(release.yml 이 같은 태그로 jar·sha256 을 첨부한다).
        JVM_RISK_VERSION: v0.1.0
      run: |
        JAR="$RUNNER_TEMP/jvm-risk-scanner.jar"
        BASE="https://github.com/cloud911948/jvm-risk-scanner/releases/download/$JVM_RISK_VERSION"
        # 릴리스 jar 를 받고 체크섬을 맞춘다. 못 받으면(사내망·릴리스 없음) 소스에서 빌드한다. 어느 쪽인지는 리포트 머리에 남긴다.
        if curl -fsSL -o "$JAR" "$BASE/jvm-risk-scanner.jar" && curl -fsSL -o "$JAR.sha256" "$BASE/jvm-risk-scanner.jar.sha256" \
           && [ "$(sha256sum "$JAR" | cut -d' ' -f1)" = "$(cut -d' ' -f1 "$JAR.sha256")" ]; then
          echo "source=release $JVM_RISK_VERSION" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::릴리스 jar 를 받지 못해 소스에서 빌드합니다"
          "${{ github.action_path }}/gradlew" -q -p "${{ github.action_path }}" fatJar
          cp "${{ github.action_path }}/build/libs/jvm-risk-scanner.jar" "$JAR"
          echo "source=built from source" >> "$GITHUB_OUTPUT"
        fi
        echo "path=$JAR" >> "$GITHUB_OUTPUT"
    - id: scan
      shell: bash
      run: |
        JAR="${{ steps.jar.outputs.path }}"
        ARGS=("${{ inputs.path }}")
        [ -n "${{ inputs.deps-file }}" ] && ARGS+=(--deps "${{ inputs.deps-file }}")
        [ "${{ inputs.sarif }}" = "true" ] && ARGS+=(--sarif-out jvm-risk.sarif)
        [ -n "${{ inputs.fail-on }}" ] && ARGS+=(--fail-on "${{ inputs.fail-on }}")
        # 한 번만 돈다. 리포트·SARIF·판정이 같은 조회 결과를 봐야 한다.
        set +e
        java -jar "$JAR" "${ARGS[@]}" > jvm-risk-report.md
        RC=$?
        set -e
        echo "" >> jvm-risk-report.md
        echo "<sub>jvm-risk-scanner ${{ steps.jar.outputs.source }}</sub>" >> jvm-risk-report.md
        cat jvm-risk-report.md >> "$GITHUB_STEP_SUMMARY"
        echo "rc=$RC" >> "$GITHUB_OUTPUT"
    - if: ${{ always() && inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      # fork 에서 온 PR 은 GITHUB_TOKEN 이 읽기 전용이라 코멘트를 못 단다. 리포트는 이미 Step Summary 에 있으니 실패로 만들지 않는다.
      run: gh pr comment "${{ github.event.pull_request.number }}" --body-file jvm-risk-report.md || echo "::warning::PR 코멘트를 달지 못했습니다(fork PR 이면 정상). Step Summary 를 확인하세요."
    - if: ${{ steps.scan.outputs.rc != '0' }}
      shell: bash
      run: |
        echo "::error::fail-on ${{ inputs.fail-on }} 기준 초과(또는 판정 불능 UNKNOWN). 리포트는 PR 코멘트·Step Summary 참조"
        exit 1
