name: JVM Runtime Risk Scan
description: JDK 27 기본값 변화(G1·압축 객체 헤더), 런타임·프레임워크 EOL, 최근 고위험 CVE 를 저장소에서 진단해 PR 코멘트로 남긴다
branding:
  icon: shield
  color: green
inputs:
  path:
    description: 스캔할 디렉터리
    default: .
  comment:
    description: PR 코멘트 작성 여부 (true/false)
    default: "true"
  deps-file:
    description: 미리 만들어 둔 의존성 해석 출력 파일 (gradle dependencies / mvn dependency:tree). 있으면 실제 버전과 전이 의존성까지 본다
    default: ""
  sarif:
    description: jvm-risk.sarif 도 생성 (true/false). 업로드는 호출 워크플로에서 github/codeql-action/upload-sarif 로
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
    - shell: bash
      run: |
        "${{ github.action_path }}/gradlew" -q -p "${{ github.action_path }}" fatJar
        JAR="${{ github.action_path }}/build/libs/jvm-risk-scanner.jar"
        DEPS=""; [ -n "${{ inputs.deps-file }}" ] && DEPS="--deps ${{ inputs.deps-file }}"
        java -jar "$JAR" "${{ inputs.path }}" $DEPS > jvm-risk-report.md
        cat jvm-risk-report.md >> "$GITHUB_STEP_SUMMARY"
        if [ "${{ inputs.sarif }}" = "true" ]; then java -jar "$JAR" "${{ inputs.path }}" $DEPS --sarif > jvm-risk.sarif; fi
    - if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      # fork 에서 온 PR 은 GITHUB_TOKEN 이 읽기 전용이라 코멘트를 못 단다. 리포트는 이미 Step Summary 에 있으니 실패로 만들지 않는다.
      run: gh pr comment "${{ github.event.pull_request.number }}" --body-file jvm-risk-report.md || echo "::warning::PR 코멘트를 달지 못했습니다(fork PR 이면 정상). Step Summary 를 확인하세요."
