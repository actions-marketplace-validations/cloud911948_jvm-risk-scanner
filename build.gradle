plugins {
    id 'java'
}

group = 'io.github.cloud911948'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

// rules.json 은 저장소 루트 한 곳에만 둔다. 복사본을 두면 테스트와 jar 가 다른 규칙을 보게 된다.
sourceSets.main.resources.srcDir(layout.projectDirectory).include('rules.json')

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'golden.update', System.getProperty('golden.update', 'false') // 골든 파일 갱신: ./gradlew test -Dgolden.update=true
}

// 단일 실행 jar. GitHub Action 과 로컬에서 `java -jar build/libs/jvm-risk-scanner.jar <dir>` 로 쓴다.
tasks.register('fatJar', Jar) {
    archiveFileName = 'jvm-risk-scanner.jar'
    manifest { attributes 'Main-Class': 'io.github.cloud911948.jvmrisk.Main' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
}
